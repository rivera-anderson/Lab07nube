version: '3.8'
services:
  node1:
    build: ./backend
    environment:
      - PORT=8081
    volumes:
      - ./backend/data:/app/data
    command: python app.py 8081

  node2:
    build: ./backend
    environment:
      - PORT=8082
    volumes:
      - ./backend/data:/app/data
    command: python app.py 8082

  node3:
    build: ./backend
    environment:
      - PORT=8083
    volumes:
      - ./backend/data:/app/data
    command: python app.py 8083

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - node1
      - node2
      - node3
